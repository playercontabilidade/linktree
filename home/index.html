<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player Contabilidade — Linktree</title>
    <script>
      (function () {
        var path = location.pathname;
        if (!/\/$/.test(path) && !/\.html?$/i.test(path)) {
          location.replace(path + "/" + location.search + location.hash);
          return;
        }
        path = path.replace(/\/index\.html?$/i, "").replace(/\/$/, "");
        path = path.replace(/\/(home|companies)(\/.*)?$/i, "");
        location.replace(path + "/companies/player/");
      })();
    </script>
  </head>
  <body>
    <p>
      Redirecionando para
      <a href="../companies/player/">Player Contabilidade</a>…
    </p>
  </body>
</html>
