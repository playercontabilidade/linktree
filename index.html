<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linktree — Grupo Player</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#05070F" />
    <meta name="color-scheme" content="dark" />
    <style>
      html { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #05070f;
        color: rgba(254, 215, 170, 0.6);
        font: 450 0.85rem/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      }
      a { color: #ffaa00; }
    </style>
    <script>
      (function () {
        var path = location.pathname;
        // /linktree (sem barra) faz URLs relativas caírem na raiz do domínio
        if (!/\/$/.test(path) && !/\.html?$/i.test(path)) {
          location.replace(path + "/" + location.search + location.hash);
          return;
        }
        path = path.replace(/\/index\.html?$/i, "").replace(/\/$/, "");
        path = path.replace(/\/(home|companies)(\/.*)?$/i, "");
        location.replace(path + "/home/");
      })();
    </script>
  </head>
  <body>
    <p>Redirecionando para <a href="home/">home</a>…</p>
  </body>
</html>
