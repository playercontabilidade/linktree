name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - feat/player-linktree
  # Só o job `quality` roda aqui — build e deploy estão guardados por
  # `if`, para um pull request nunca publicar no Pages.
  pull_request:
    branches:
      - main
      - feat/player-linktree
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check colour token contrast
        run: node scripts/check-contrast.js

      - name: Lighthouse budgets
        run: npx --yes @lhci/cli@0.14.x autorun

  build:
    needs: quality
    # Publicar é efeito de merge, não de proposta.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate production config
        env:
          ENV: production
          BASE_PATH: /linktree
          SITE_URL: https://playercontabilidade.github.io/linktree
        run: |
          node scripts/generate-config.js
          grep -q '"BASE_PATH": "/linktree"' shared/js/config.js
          grep -q '"ENV": "production"' shared/js/config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
